# Destiny — deep-space navy, and the game's three energies at full strength.
# The ground is almost black with a blue cast. Text is ice white. Colour comes
# from the damage types and the loot tiers of the first game: Arc blue, Void
# purple, Solar orange, exotic gold.

mode                     = "dark"

# Signal, selection and the de-emphasised ramp
accent                   = "#4cc9ff"  # Arc
selection                = "#1f3a5f"
muted                    = "#586c96"

# Ground, from the deepest surface up to the elevated one
background               = "#090d16"
dark_background          = "#070a11"
darker_background        = "#04060b"
lighter_background       = "#121a2a"

# Text, from de-emphasised up to the cursor
foreground               = "#d9e8ff"
dark_foreground          = "#7389ad"
light_foreground         = "#b4c8e8"
bright_foreground        = "#ffffff"

# Window borders. The focused window is framed in Arc running into Void.
hyprland_active_border   = "rgba(4cc9ffee) rgba(b97affee) 45deg"
hyprland_inactive_border = "rgba(586c9666)"
active_border_color      = "#4cc9ff"
active_tab_background    = "#1f3a5f"

# Named colours
red                      = "#ff5468"  # hostile
orange                   = "#ff8a3d"  # Solar
yellow                   = "#f5c945"  # exotic
green                    = "#3ddc97"  # uncommon
cyan                     = "#4fe3d0"  # the star chart
blue                     = "#5b8dff"  # rare
magenta                  = "#b97aff"  # Void, legendary
brown                    = "#c19a5b"  # bronze

# Bright variants. Lighter, not darker — this ground is dark.
bright_red               = "#ff8a98"
bright_yellow            = "#ffe08a"
bright_green             = "#86f0c0"
bright_cyan              = "#9af3e8"
bright_blue              = "#94b4ff"
bright_magenta           = "#d4b0ff"
