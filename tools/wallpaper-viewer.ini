[options]
fullscreen = true
background = 000000
scaling_mode = full
overlay = false
loop_input = true
suppress_default_binds = true
title_text = Destiny Wallpapers — ${imv_current_index}/${imv_file_count} — ${imv_current_file##*/}
overlay_text = ${imv_current_index}/${imv_file_count}  ${imv_current_file##*/}  |  ← →  /  Esc
overlay_font = sans:16

[binds]
<Left> = prev
<Right> = next
<Escape> = quit
q = quit
<Home> = goto 1
<End> = goto -1
i = overlay
f = fullscreen
